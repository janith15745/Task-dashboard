<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-kanban-fill me-2"></i>TaskFlow</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item me-3">
                        <span class="text-light small" id="current-date"></span>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addTaskModal">
                            <i class="bi bi-plus-lg me-1"></i> New Task
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        
        <div class="p-4 mb-4 bg-white rounded-3 shadow-sm border-start border-primary border-4">
            <h1 class="h3 fw-bold text-dark">Welcome back, Developer! 👋</h1>
            <p class="text-muted mb-0">Here is your daily task overview. Keep up the momentum!</p>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card border-0 shadow-sm bg-primary text-white">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-title text-uppercase small fw-bold">Total Tasks</h6>
                            <h2 class="display-6 fw-bold mb-0" id="stat-total">0</h2>
                        </div>
                        <i class="bi bi-list-task display-4 opacity-50"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm bg-warning text-dark">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-title text-uppercase small fw-bold">In Progress</h6>
                            <h2 class="display-6 fw-bold mb-0" id="stat-progress">0</h2>
                        </div>
                        <i class="bi bi-hourglass-split display-4 opacity-50"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm bg-success text-white">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-title text-uppercase small fw-bold">Completed</h6>
                            <h2 class="display-6 fw-bold mb-0" id="stat-completed">0</h2>
                        </div>
                        <i class="bi bi-check-circle display-4 opacity-50"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-2 mb-4 align-items-center">
            <div class="col-md-6">
                <div class="btn-group shadow-sm" role="group">
                    <button type="button" class="btn btn-outline-secondary active filter-btn" data-filter="all">All Tasks</button>
                    <button type="button" class="btn btn-outline-secondary filter-btn" data-filter="pending">Pending</button>
                    <button type="button" class="btn btn-outline-secondary filter-btn" data-filter="completed">Completed</button>
                </div>
            </div>
            <div class="col-md-6">
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" id="search-input" class="form-control border-start-0" placeholder="Search tasks...">
                </div>
            </div>
        </div>

        <div class="row g-3" id="task-container">
        </div>

        <div id="empty-state" class="text-center py-5 d-none">
            <i class="bi bi-folder2-open display-1 text-muted"></i>
            <p class="text-muted mt-3">No tasks found. Click "New Task" to create one!</p>
        </div>
    </div>

    <div class="modal fade" id="addTaskModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="bi bi-plus-circle me-2"></i>Create New Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="task-form">
                        <div class="mb-3">
                            <label for="task-title" class="form-label fw-semibold">Task Title</label>
                            <input type="text" class="form-control" id="task-title" placeholder="e.g. Redesign Landing Page" required>
                        </div>
                        <div class="mb-3">
                            <label for="task-desc" class="form-label fw-semibold">Description</label>
                            <textarea class="form-control" id="task-desc" rows="3" placeholder="Provide brief details about the task..." required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="task-priority" class="form-label fw-semibold">Priority Level</label>
                            <select class="form-select" id="task-priority">
                                <option value="Low">Low</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>
                        <div class="text-end">
                            <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save Task</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
